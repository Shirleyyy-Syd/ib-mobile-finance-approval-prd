<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="收入切分审批">
<title>投行CRM-收入切分审批</title>
<style>
:root {
  --primary: #1890ff;
  --primary-dark: #096dd9;
  --primary-light: #e6f7ff;
  --success: #52c41a;
  --warning: #faad14;
  --danger: #ff4d4f;
  --info: #1890ff;
  --bg: #f0f2f5;
  --card-bg: #ffffff;
  --text-primary: #262626;
  --text-secondary: #595959;
  --text-hint: #8c8c8c;
  --text-disabled: #bfbfbf;
  --border: #e8e8e8;
  --border-light: #f0f0f0;
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --radius: 8px;
  --radius-sm: 4px;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  overscroll-behavior: none;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Helvetica Neue", sans-serif;
  font-size: 14px;
  color: var(--text-primary);
  background: #111;
}
body { display: grid; place-items: center; }
#app {
  width: 100vw;
  height: 100vh;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}
@media (min-width: 700px) {
  #app {
    width: 390px;
    height: 844px;
    border-radius: 44px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.35);
  }
}

/* ===== Screen Transition ===== */
.screen-enter { animation: slideIn 0.28s ease-out; }
@keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

/* ===== NavBar ===== */
.navbar {
  display: flex;
  align-items: center;
  height: 44px;
  padding: 0 12px;
  background: var(--card-bg);
  border-bottom: 0.5px solid var(--border);
  position: relative;
  z-index: 10;
  flex-shrink: 0;
}
.navbar-back {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-primary);
  cursor: pointer;
  font-size: 20px;
}
.navbar-title {
  flex: 1;
  text-align: center;
  font-size: 17px;
  font-weight: 600;
  color: var(--text-primary);
  margin: 0 -32px;
  pointer-events: none;
}
.navbar-right {
  min-width: 32px;
  display: flex;
  justify-content: flex-end;
  align-items: center;
}

/* ===== Content Area ===== */
.content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* ===== Tabs ===== */
.tabs {
  display: flex;
  background: var(--card-bg);
  border-bottom: 0.5px solid var(--border);
}
.tab {
  flex: 1;
  text-align: center;
  padding: 12px 0;
  font-size: 15px;
  color: var(--text-secondary);
  cursor: pointer;
  position: relative;
  transition: color 0.2s;
}
.tab.active { color: var(--primary); font-weight: 600; }
.tab.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 3px;
  background: var(--primary);
  border-radius: 2px;
}
.tab-badge {
  display: inline-block;
  min-width: 18px;
  height: 18px;
  line-height: 18px;
  padding: 0 5px;
  margin-left: 4px;
  font-size: 11px;
  color: #fff;
  background: var(--danger);
  border-radius: 9px;
  vertical-align: top;
}

/* ===== Search Bar ===== */
.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--card-bg);
  border-bottom: 0.5px solid var(--border-light);
}
.search-input-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  background: var(--bg);
  border-radius: 6px;
  padding: 6px 10px;
  gap: 6px;
}
.search-input-wrap input {
  flex: 1;
  border: none;
  background: none;
  outline: none;
  font-size: 14px;
  color: var(--text-primary);
}
.search-input-wrap input::placeholder { color: var(--text-hint); }
.search-icon { color: var(--text-hint); font-size: 14px; flex-shrink: 0; }
.search-filter-btn {
  width: 34px;
  height: 34px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
}
.search-filter-btn.active { color: var(--primary); }
.search-filter-dot {
  position: absolute;
  top: 3px;
  right: 3px;
  width: 7px;
  height: 7px;
  background: var(--danger);
  border: 1px solid #fff;
  border-radius: 50%;
}

/* ===== List ===== */
.list-container { padding: 8px 12px 80px; }
.list-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.1s;
}
.list-card:active { transform: scale(0.98); }
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 10px;
}
.card-voucher {
  font-size: 13px;
  color: var(--text-hint);
  font-weight: 400;
}
.card-project {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  margin: 4px 0 8px;
  line-height: 1.4;
}
.card-info-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  margin-bottom: 10px;
}
.card-info-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
}
.card-info-label { color: var(--text-hint); }
.card-info-value { color: var(--text-secondary); font-weight: 500; }
.card-amount { color: var(--danger); font-weight: 600; font-size: 15px; }
.card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 10px;
  border-top: 0.5px solid var(--border-light);
}
.card-handler { font-size: 12px; color: var(--text-hint); }
.card-actions { display: flex; gap: 8px; }

/* ===== Status Badge ===== */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
}
.badge-new { background: #fff7e6; color: var(--warning); }
.badge-progress { background: var(--primary-light); color: var(--primary); }
.badge-done { background: #f6ffed; color: var(--success); }
.badge-reject { background: #fff1f0; color: var(--danger); }

/* ===== 统一待办列表 ===== */
.list-container-v2 { padding: 8px 12px 80px; }
.list-card-v2 {
  background: #fff;
  border-radius: 0;
  padding: 12px 14px;
  margin-bottom: 0;
  border-bottom: 1px solid #f0f0f0;
  box-shadow: none;
  cursor: pointer;
  transition: transform 0.1s;
  display: flex;
  align-items: center;
  gap: 10px;
  position: relative;
  overflow: hidden;
}
.list-card-v2:active { transform: scale(0.99); }
.list-card-v2.batch-selected {
  border: 1px solid var(--primary);
  background: #f5faff;
}
.list-card-v2.batch-disabled {
  opacity: 0.55;
}
.batch-check {
  width: 22px;
  height: 22px;
  border: 1.5px solid #bfbfbf;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
}
.batch-check.selected {
  border-color: var(--primary);
  background: var(--primary);
}
.batch-check.selected::after {
  content: '';
  width: 6px;
  height: 10px;
  border: 2px solid #fff;
  border-top: none;
  border-left: none;
  transform: rotate(45deg) translate(-1px, -1px);
}
.batch-check.disabled {
  background: #f5f5f5;
  border-color: #d9d9d9;
}
.card-v2-body {
  flex: 1;
  min-width: 0;
}
.card-v2-top {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 9px;
}
.biz-tag {
  display: inline-block;
  padding: 1px 4px;
  background: #e6f4ff;
  color: var(--primary);
  border-radius: 2px;
  font-size: 10px;
  font-weight: 500;
  flex-shrink: 0;
}
.card-v2-title {
  font-size: 14px;
  font-weight: 500;
  color: #1a1a1a;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.card-v2-meta-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(112px, .82fr);
  column-gap: 16px;
  row-gap: 8px;
  padding-right: 4px;
  color: #8e8e93;
  font-size: 12px;
  line-height: 1.35;
}
.card-v2-meta-cell {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.card-v2-meta-value { color: #73767c; }
.card-v2-meta-time { white-space: nowrap; }
.btn-v2-action {
  padding: 5px 10px;
  background: #fff;
  border: 1px solid var(--primary);
  color: var(--primary);
  border-radius: 5px;
  font-size: 12px;
  font-weight: 400;
  cursor: pointer;
  flex-shrink: 0;
  white-space: nowrap;
  align-self: center;
}
.btn-v2-action:active { opacity: 0.7; }
.list-end-tip {
  text-align: center;
  padding: 16px 0 8px;
  font-size: 13px;
  color: #c7c7cc;
}

/* ===== Filter Bar ===== */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: #fff;
  border-bottom: 0.5px solid var(--border-light);
}
.filter-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  background: #fff;
  border: 1px solid var(--primary);
  color: var(--primary);
  border-radius: 14px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}
.filter-btn.filter-btn-gray {
  border-color: #e5e5e5;
  color: #666;
}
.filter-btn.active { background: var(--primary-light); }
.batch-selection-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 12px;
  background: #fff;
  border-bottom: 0.5px solid var(--border-light);
  font-size: 12px;
  color: var(--text-secondary);
}
.batch-entry-btn,
.batch-text-btn {
  border: none;
  background: transparent;
  color: var(--primary);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
}
.batch-entry-btn {
  margin-left: auto;
  border: 1px solid var(--primary);
  border-radius: 14px;
  padding: 4px 12px;
}
.batch-entry-btn:focus-visible {
  outline: 2px solid rgba(22, 119, 255, 0.35);
  outline-offset: 2px;
}
@media (max-width: 380px) {
  .filter-bar { gap: 6px; }
  .filter-btn,
  .batch-entry-btn { padding-left: 8px; padding-right: 8px; }
}
.batch-selection-actions {
  display: flex;
  gap: 12px;
}

/* ===== Biz Panel ===== */
.biz-panel-mask {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.3);
  z-index: 20;
}
.biz-panel {
  position: absolute;
  top: 154px;
  left: 0;
  width: 140px;
  background: #fff;
  border-radius: 0 8px 8px 0;
  box-shadow: 2px 2px 8px rgba(0,0,0,0.12);
  z-index: 21;
  overflow: hidden;
}
.biz-panel-item {
  padding: 12px 16px;
  font-size: 14px;
  color: #333;
  cursor: pointer;
  border-bottom: 0.5px solid #f5f5f5;
}
.biz-panel-item:last-child { border-bottom: none; }
.biz-panel-item.active {
  background: var(--primary-light);
  color: var(--primary);
  font-weight: 600;
}
.biz-panel-count { font-size: 12px; color: #8e8e93; margin-left: 2px; }

/* ===== Advanced Filter Sheet ===== */
.advanced-filter-mask {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.48);
  z-index: 80;
  display: flex;
  align-items: flex-end;
}
.advanced-filter-sheet {
  width: 100%;
  max-height: 78%;
  overflow-y: auto;
  background: #fff;
  border-radius: 16px 16px 0 0;
  animation: slideUp 0.25s ease-out;
}
.advanced-filter-header {
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 0.5px solid var(--border-light);
  position: sticky;
  top: 0;
  background: #fff;
  z-index: 1;
}
.advanced-filter-title {
  font-size: 18px;
  font-weight: 600;
}
.advanced-filter-close {
  position: absolute;
  right: 16px;
  top: 11px;
  width: 32px;
  height: 32px;
  border: none;
  background: transparent;
  color: var(--text-hint);
  font-size: 28px;
  line-height: 28px;
  font-weight: 300;
  cursor: pointer;
}
.advanced-filter-body { padding: 18px 16px 12px; }
.advanced-filter-group { margin-bottom: 20px; }
.advanced-filter-label {
  display: block;
  margin-bottom: 10px;
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
}
.advanced-filter-select {
  width: 100%;
  height: 46px;
  padding: 0 38px 0 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #fff;
  color: var(--text-primary);
  font-size: 15px;
  font-family: inherit;
  outline: none;
}
.advanced-filter-select:focus { border-color: var(--primary); }
.time-range-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.time-range-btn {
  height: 40px;
  border: none;
  border-radius: 4px;
  background: #f7f8fa;
  color: var(--text-secondary);
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
}
.time-range-btn.active {
  color: var(--primary);
  background: #eaf3ff;
  font-weight: 500;
}
.custom-date-range {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
}
.custom-date-range input {
  min-width: 0;
  flex: 1;
  height: 40px;
  padding: 0 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-primary);
  font-family: inherit;
}
.custom-date-separator { color: var(--text-hint); }
.advanced-filter-actions {
  display: flex;
  gap: 12px;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  border-top: 0.5px solid var(--border);
  position: sticky;
  bottom: 0;
  background: #fff;
}
.advanced-filter-action {
  flex: 1;
  height: 46px;
  border-radius: 5px;
  font-size: 16px;
  font-family: inherit;
  cursor: pointer;
}
.advanced-filter-reset {
  color: var(--primary);
  background: #fff;
  border: 1px solid var(--primary);
}
.advanced-filter-confirm {
  color: #fff;
  background: var(--primary);
  border: 1px solid var(--primary);
}

/* ===== Tab Count ===== */
.tab-count { font-size: 12px; color: inherit; }

/* ===== Buttons ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 6px 16px;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 500;
  border: none;
  cursor: pointer;
  transition: opacity 0.2s;
  white-space: nowrap;
}
.btn:active { opacity: 0.7; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-outline { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
.btn-default { background: var(--bg); color: var(--text-secondary); }
.btn-danger { background: #fff; color: var(--danger); border: 1px solid var(--danger); }
.btn-ghost { background: #fff; color: var(--text-primary); border: 1px solid var(--border); }
.btn-block { width: 100%; padding: 12px; font-size: 16px; border-radius: 6px; }
.btn-sm { padding: 4px 12px; font-size: 12px; }

/* ===== Bottom Bar ===== */
.bottom-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--card-bg);
  border-top: 0.5px solid var(--border);
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
  display: flex;
  gap: 12px;
  z-index: 10;
}
.bottom-bar .btn { flex: 1; }

/* ===== Detail Sections ===== */
.detail-section {
  background: var(--card-bg);
  margin: 0 12px 8px;
  border-radius: var(--radius);
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
.approval-header {
  background: var(--card-bg);
  padding: 12px 16px;
  margin-bottom: 8px;
  display: flex;
  gap: 16px;
}
.approval-header-info {
  flex: 1;
  min-width: 0;
}
.approval-header-label {
  font-size: 12px;
  color: var(--text-hint);
  margin-bottom: 2px;
}
.approval-header-value {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  cursor: pointer;
}
.section-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-arrow {
  color: var(--text-hint);
  font-size: 12px;
  transition: transform 0.2s;
}
.section-arrow.collapsed { transform: rotate(-90deg); }
.section-body { padding: 0 16px 14px; }

/* ===== Table ===== */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.mini-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  min-width: 360px;
}
.mini-table th {
  background: #fafafa;
  color: var(--text-hint);
  font-weight: 500;
  padding: 8px 6px;
  text-align: left;
  white-space: nowrap;
  border-bottom: 1px solid var(--border);
}
.mini-table td {
  padding: 8px 6px;
  color: var(--text-secondary);
  border-bottom: 0.5px solid var(--border-light);
  white-space: nowrap;
}
.mini-table td.amount { color: var(--danger); font-weight: 500; }
.mini-table tr:last-child td { border-bottom: none; }

/* ===== Timeline ===== */
.timeline { padding: 4px 0; }
.timeline-item {
  display: flex;
  gap: 12px;
  padding-bottom: 16px;
  position: relative;
}
.timeline-item:last-child { padding-bottom: 0; }
.timeline-item:not(:last-child)::before {
  content: '';
  position: absolute;
  left: 7px;
  top: 20px;
  bottom: 0;
  width: 1px;
  background: var(--border);
}
.timeline-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 3px;
  z-index: 1;
}
.timeline-dot.approved { background: var(--success); }
.timeline-dot.rejected { background: var(--danger); }
.timeline-dot.submitted { background: var(--primary); }
.timeline-dot.pending { background: #d9d9d9; }
.timeline-content { flex: 1; min-width: 0; overflow: visible; }
.timeline-header {
  margin-bottom: 4px;
}
.timeline-time {
  display: block;
  font-size: 12px;
  color: var(--text-hint);
  margin-bottom: 3px;
}
.timeline-node-row {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 4px;
  line-height: 1.5;
  color: var(--text-primary);
}
.timeline-node-name { font-size: 14px; font-weight: 500; }
.timeline-approver { font-size: 14px; color: var(--text-secondary); }
.timeline-opinion {
  font-size: 13px;
  color: var(--text-secondary);
  background: var(--bg);
  padding: 6px 10px;
  border-radius: 4px;
  margin-top: 4px;
  line-height: 1.5;
}

/* ===== Approval Form ===== */
.textarea {
  width: 100%;
  min-height: 80px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 14px;
  font-family: inherit;
  resize: none;
  outline: none;
  color: var(--text-primary);
  background: var(--bg);
  transition: border-color 0.2s;
}
.textarea:focus { border-color: var(--primary); background: #fff; }
.textarea-label {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 2px;
}
.required-mark { color: var(--danger); font-size: 14px; }

/* ===== Transfer Page ===== */
.member-list { padding: 8px 12px 80px; }
.member-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;

/* ===== 收入切分详情 Mock（按需求 3.1.4 审批规则 ii 覆盖三条路径） =====
   路径A 转办  ：项目负责人转办给项目成员 → 成员提交 → 回项目负责人审批 → 部组负责人
   路径B 未转办：项目负责人自己提交 → 直接转部组负责人审批
   路径C        ：部组负责人通过后 → 分支机构承揽人、分支机构负责人二级审批 */
function makeSplitDetail(cfg) {
  const netAmount = cfg.amount - cfg.estimatedCost;
  const branchTotal = Math.round(netAmount * 0.2);
  const bj = Math.round(branchTotal * 0.75);
  const sh = branchTotal - bj;
  const bjWang = Math.round(bj * 0.6);
  const history1Amount = Math.round(cfg.amount * 0.9);
  const history1EstimatedCost = Math.round(cfg.estimatedCost * 0.6);
  const history1NetAmount = history1Amount - history1EstimatedCost;
  const history1MainAmount = Math.round(history1NetAmount * 0.6);
  const history1CoAmount = Math.round(history1NetAmount * 0.2);
  const history1BranchAmount = history1NetAmount - history1MainAmount - history1CoAmount;
  const history2Amount = Math.round(cfg.amount * 0.76);
  const history2EstimatedCost = Math.round(cfg.estimatedCost * 0.5);
  const history2NetAmount = history2Amount - history2EstimatedCost;
  const history2MainAmount = Math.round(history2NetAmount * 0.7);
  const history2CoAmount = Math.round(history2NetAmount * 0.15);
  const history2BranchAmount = history2NetAmount - history2MainAmount - history2CoAmount;
  return {
    submitter: cfg.submitter,
    basicInfo: {
      flowNo: cfg.flowNo,
      confirmer: cfg.confirmer,
      applyDept: cfg.applyDept,
      applyDate: cfg.applyDate,
      voucherNo: cfg.voucherNo,
      projectName: cfg.projectName,
      projectNo: cfg.projectNo,
      amount: cfg.amount,
      estimatedCost: cfg.estimatedCost,
      summary: cfg.summary || (cfg.projectName + "收入切分"),
      auxAccounting: cfg.auxAccounting || cfg.projectNo,
      projectType: cfg.projectType
    },
    historySplits: [
      { voucherNo: "FIN20260301001", mainDept: cfg.applyDept, mainRatio: "60%", coDept: "投行二部", coRatio: "20%", branch: "北京分公司", branchRatio: "20%" },
      { voucherNo: "FIN20260115002", mainDept: cfg.applyDept, mainRatio: "70%", coDept: "投行三部", coRatio: "15%", branch: "上海分公司", branchRatio: "15%" }
    ],
    historyDetailData: [
      {
        flowNo: "FIN20260301001", confirmer: cfg.confirmer, applyDept: cfg.applyDept, applyDate: "2026-03-01",
        voucherNo: "FIN20260301001", projectName: cfg.projectName, projectNo: cfg.projectNo,
        amount: history1Amount, estimatedCost: history1EstimatedCost,
        splits: [
          { type: "主办部门", deptName: cfg.applyDept, ratio: "60%", amount: history1MainAmount },
          { type: "协办部门", deptName: "投行二部", ratio: "20%", amount: history1CoAmount },
          { type: "分支机构", deptName: "北京分公司", ratio: "20%", amount: history1BranchAmount }
        ]
      },
      {
        flowNo: "FIN20260115002", confirmer: cfg.confirmer, applyDept: cfg.applyDept, applyDate: "2026-01-15",
        voucherNo: "FIN20260115002", projectName: cfg.projectName, projectNo: cfg.projectNo,
        amount: history2Amount, estimatedCost: history2EstimatedCost,
        splits: [
          { type: "主办部门", deptName: cfg.applyDept, ratio: "70%", amount: history2MainAmount },
          { type: "协办部门", deptName: "投行三部", ratio: "15%", amount: history2CoAmount },
          { type: "分支机构", deptName: "上海分公司", ratio: "15%", amount: history2BranchAmount }
        ]
      }
    ],
    currentSplits: [
      { type: "分支", deptName: "北京分公司", ratio: "75%", amount: bj },
      { type: "分支", deptName: "上海分公司", ratio: "25%", amount: sh }
    ],
    branchOverview: {
      bizType: cfg.bizType,
      accountElement: "经纪业务收入",
      totalAmount: branchTotal,
      splitRatio: "20%",
      remark: "本次收入切分所有分支机构总概况"
    },
    branchContributions: [
      {
        branchName: "北京分公司",
        cutAmount: bj,
        members: [
          { name: "王五", empNo: "EMP001", ratio: "60%", amount: bjWang },
          { name: "赵六", empNo: "EMP002", ratio: "40%", amount: bj - bjWang }
        ]
      },
      {
        branchName: "上海分公司",
        cutAmount: sh,
        members: [{ name: "孙七", empNo: "EMP003", ratio: "100%", amount: sh }]
      }
    ],
    approvalRecords: cfg.approvalRecords
  };
}

/* ========== Helpers ========== */
function formatCurrency(num) {
  if (!num && num !== 0) return "-";
  return num.toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function getInitials(name) {
  return name ? name.slice(-2) : "?";
}

      <div className="navbar-back" onClick={onBack}>

      </div>

}

function Badge({ type, text }) {
  const cls = type === "new" ? "badge-new" : type === "progress" ? "badge-progress" : type === "done" ? "badge-done" : type === "reject" ? "badge-reject" : "badge-progress";
  return <span className={"badge " + cls}>{text}</span>;
}

    if (item.id === 101) return "confirm-101";
    if (item.id === 102) return "confirm-102";
    const detail = getConfirmDetail(item);
    return detail.projectType === "非股非债" ? "confirm-103-project" : "confirm-102-project";
  }
  if (item.id === 1) return "split-1";
  if (item.id === 2 || item.id === 4) return "split-2";
  if (item.id === 3) return "split-3";
  return "split-5-history";
}

function ListCard({ item, onClick, onAction, actionLabel, batchMode, batchEligible, selected, onSelect, reviewScene }) {
  const flowName = item.flowType === "incomeConfirm" ? "收入确认申请流程" : "收入切分申请流程";
  const submitterName = getItemSubmitterName(item);
  const submitTime = getItemSubmitTime(item);
  const handleCardClick = () => {
    if (batchMode) {
      if (batchEligible) onSelect(item);
      return;
    }
    onClick();
  };
  return (
    <div
      className={"list-card-v2" + (selected ? " batch-selected" : "") + (batchMode && !batchEligible ? " batch-disabled" : "")}
      data-review-scene={batchMode ? "list-batch" : reviewScene}
      onClick={handleCardClick}
    >
      {batchMode && (
        <span className={"batch-check" + (selected ? " selected" : "") + (!batchEligible ? " disabled" : "")} />
      )}
      <div className="card-v2-body">
        <div className="card-v2-top">
          <span className="biz-tag">投行</span>
          <span className="card-v2-title">{item.projectName}</span>
        </div>
        <div className="card-v2-meta-grid">
          <div className="card-v2-meta-cell card-v2-meta-value">{flowName}</div>
          <div className="card-v2-meta-cell card-v2-meta-value">{submitterName}</div>
          <div className="card-v2-meta-cell card-v2-meta-value">{item.node}</div>
          <div className="card-v2-meta-cell card-v2-meta-time">{submitTime.replace(/-/g, "/")}</div>
        </div>
      </div>
      {!batchMode && (
        <button className="btn-v2-action" onClick={(e) => { e.stopPropagation(); onAction(item); }}>
          {actionLabel || "去处理"}
        </button>
      )}
    </div>
  );
}

function ListPage({ onApprove, onViewDetail, onTransfer, onApproveIncomeConfirm, onViewIncomeConfirmDetail, initialTab = "todo", onTabChange, initialBatchMode = false, initialSelectedBatchIds = [] }) {
  const [tab, setTab] = useState(initialTab);
  const [searchText, setSearchText] = useState("");
  const [bizFilter, setBizFilter] = useState("all");
  const [showBizPanel, setShowBizPanel] = useState(false);
  const emptyAdvancedFilter = {
    flowType: "all",
    submitter: "all",
    timeRange: "all",
    customStart: "",
    customEnd: ""
  };
  const [showAdvancedFilter, setShowAdvancedFilter] = useState(false);
  const [advancedFilter, setAdvancedFilter] = useState(emptyAdvancedFilter);
  const [draftAdvancedFilter, setDraftAdvancedFilter] = useState(emptyAdvancedFilter);
  const [batchMode, setBatchMode] = useState(initialBatchMode);
  const [selectedBatchIds, setSelectedBatchIds] = useState(initialSelectedBatchIds);
  const [processedBatchIds, setProcessedBatchIds] = useState([]);
  const [batchSheet, setBatchSheet] = useState(null);
  const [batchToast, setBatchToast] = useState(null);

  const bizTypes = [
    { key: "all", label: "全部待办" },
    { key: "finance", label: "财务待办" },
    { key: "ib", label: "投行待办" },
    { key: "self", label: "自律待办" },
    { key: "draft", label: "底稿待办" },
    { key: "supervise", label: "后督待办" }
  ];

  const allTodoList = [...mockTodoList, ...mockIncomeConfirmTodoList]
    .filter(item => !processedBatchIds.includes(item.id));
  const allDoneList = [...mockDoneList, ...mockIncomeConfirmDoneList];
  const allDoingList = mockDoingList;
  const allItems = [...allTodoList, ...allDoneList, ...allDoingList];
  const submitters = [...new Set(allItems.map(getItemSubmitterName).filter(Boolean))];
  const timeRangeOptions = [
    { key: "all", label: "不限" },
    { key: "today", label: "今天" },
    { key: "yesterday", label: "昨天" },
    { key: "thisWeek", label: "本周" },
    { key: "lastWeek", label: "上周" },
    { key: "thisMonth", label: "本月" },
    { key: "lastMonth", label: "上月" },
    { key: "custom", label: "自定义" }
  ];

  const isInTimeRange = (dateText, filter) => {
    if (filter.timeRange === "all") return true;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const target = new Date(dateText + "T00:00:00");
    let start = new Date(today);
    let end = new Date(today);

    if (filter.timeRange === "yesterday") {
      start.setDate(start.getDate() - 1);
      end = new Date(start);
    } else if (filter.timeRange === "thisWeek" || filter.timeRange === "lastWeek") {
      const mondayOffset = (today.getDay() + 6) % 7;
      start.setDate(today.getDate() - mondayOffset - (filter.timeRange === "lastWeek" ? 7 : 0));
      end = new Date(start);
      end.setDate(start.getDate() + 6);
    } else if (filter.timeRange === "thisMonth") {
      start = new Date(today.getFullYear(), today.getMonth(), 1);
      end = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    } else if (filter.timeRange === "lastMonth") {
      start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
      end = new Date(today.getFullYear(), today.getMonth(), 0);
    } else if (filter.timeRange === "custom") {
      if (!filter.customStart && !filter.customEnd) return true;
      if (filter.customStart) start = new Date(filter.customStart + "T00:00:00");
      else start = new Date("1970-01-01T00:00:00");
      if (filter.customEnd) end = new Date(filter.customEnd + "T23:59:59");
      else end = new Date("2999-12-31T23:59:59");
    }
    return target >= start && target <= end;
  };

  const filterList = (list) => list.filter(item =>
    (!searchText || item.voucherNo.includes(searchText) || item.projectName.includes(searchText)) &&
    (bizFilter === "all" || item.bizType === bizFilter) &&
    (advancedFilter.flowType === "all" || item.flowType === advancedFilter.flowType) &&
    (advancedFilter.submitter === "all" || getItemSubmitterName(item) === advancedFilter.submitter) &&
    isInTimeRange(item.incomeDate, advancedFilter)
  );
  const todoList = filterList(allTodoList);
  const doneList = filterList(allDoneList);
  const doingList = filterList(allDoingList);
  const todoCount = todoList.length;
  const batchEligibleItems = todoList.filter(item => item.flowType === "incomeSplit" && item.node === "部组负责人");
  const currentBizLabel = bizTypes.find(b => b.key === bizFilter).label;
  const financeCount = allTodoList.filter(i => i.bizType === "finance").length;
  const hasAdvancedFilter = advancedFilter.flowType !== "all" ||
    advancedFilter.submitter !== "all" ||
    advancedFilter.timeRange !== "all";
  const openAdvancedFilter = () => {
    setDraftAdvancedFilter({ ...advancedFilter });
    setShowBizPanel(false);
    setShowAdvancedFilter(true);
  };
  const resetAdvancedFilter = () => {
    setDraftAdvancedFilter({ ...emptyAdvancedFilter });
  };
  const confirmAdvancedFilter = () => {
    setAdvancedFilter({ ...draftAdvancedFilter });
    setShowAdvancedFilter(false);
  };
  const switchTab = (nextTab) => {
    setTab(nextTab);
    if (onTabChange) onTabChange(nextTab);
    setBatchMode(false);
    setSelectedBatchIds([]);
  };
  const toggleBatchItem = (item) => {
    setSelectedBatchIds(ids => ids.includes(item.id)
      ? ids.filter(id => id !== item.id)
      : [...ids, item.id]);
  };
  const toggleAllBatchItems = () => {
    const eligibleIds = batchEligibleItems.map(item => item.id);
    const allSelected = eligibleIds.length > 0 && eligibleIds.every(id => selectedBatchIds.includes(id));
    setSelectedBatchIds(allSelected ? [] : eligibleIds);
  };
  const exitBatchMode = () => {
    setBatchMode(false);
    setSelectedBatchIds([]);
    setBatchSheet(null);
  };
  const confirmBatchApproval = (mode, opinion) => {
    if (mode === "reject" && !opinion.trim()) {
      setBatchToast({ type: "warning", text: "批量退回时请填写审批意见" });
      setTimeout(() => setBatchToast(null), 1800);
      return;
    }
    const count = selectedBatchIds.length;
    setProcessedBatchIds(ids => [...ids, ...selectedBatchIds]);
    setBatchSheet(null);
    setBatchMode(false);
    setSelectedBatchIds([]);
    setBatchToast({ type: "success", text: `已批量${mode === "reject" ? "退回" : "同意"}${count}条任务` });
    setTimeout(() => setBatchToast(null), 1800);
  };

  return (
    <div className="flex-col" data-review-scene="list">
      <NavBar title="待办处理" />
      <div className="tabs">
        <div className={"tab" + (tab === "todo" ? " active" : "")} onClick={() => switchTab("todo")}>
          待办{todoCount > 0 && <span className="tab-count">({todoCount})</span>}
        </div>
        <div className={"tab" + (tab === "doing" ? " active" : "")} onClick={() => switchTab("doing")}>
          在办{doingList.length > 0 && <span className="tab-count">({doingList.length})</span>}
        </div>
        <div className={"tab" + (tab === "done" ? " active" : "")} onClick={() => switchTab("done")}>
          办结
        </div>
        <div className={"tab" + (tab === "circulate" ? " active" : "")} onClick={() => switchTab("circulate")}>
          传阅<span className="tab-count">(0)</span>
        </div>
      </div>
      <div className="search-bar">
        <div className="search-input-wrap">
          <svg className="search-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
            <circle cx="6" cy="6" r="5" stroke="#8c8c8c" strokeWidth="1.2"/>
            <path d="M10 10L13 13" stroke="#8c8c8c" strokeWidth="1.2" strokeLinecap="round"/>
          </svg>
          <input
            type="text"
            placeholder="主题"
            value={searchText}
            onChange={(e) => setSearchText(e.target.value)}
          />
        </div>
        <button
          type="button"
          className={"search-filter-btn" + (hasAdvancedFilter ? " active" : "")}
          aria-label="筛选"
          onClick={openAdvancedFilter}
        >
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M4 5H20L14 12V18L10 20V12L4 5Z" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
          {hasAdvancedFilter && <span className="search-filter-dot" />}
        </button>
      </div>
      <div className="filter-bar">
        <button className={"filter-btn" + (showBizPanel ? " active" : "")} onClick={() => setShowBizPanel(!showBizPanel)}>
          {currentBizLabel}
          <svg width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M1 2L4 5L7 2" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/></svg>
        </button>
        <button className="filter-btn filter-btn-gray">
          最新到达优先
          <svg width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M1 2L4 5L7 2" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/></svg>
        </button>
        {tab === "todo" && !batchMode && batchEligibleItems.length > 0 && (
          <button
            type="button"
            className="batch-entry-btn"
            aria-label="进入批量审批模式"
            data-review-scene="list-batch"
            onClick={() => { setBatchMode(true); setSelectedBatchIds([]); }}
          >
            批量审批
          </button>
        )}
      </div>
      {tab === "todo" && batchMode && (
        <div className="batch-selection-bar" data-review-scene="list-batch">
          <span>已选择 {selectedBatchIds.length} 条</span>
          <div className="batch-selection-actions">
            <button type="button" className="batch-text-btn" onClick={toggleAllBatchItems}>
              {batchEligibleItems.length > 0 && batchEligibleItems.every(item => selectedBatchIds.includes(item.id)) ? "取消全选" : "全选"}
            </button>
            <button type="button" className="batch-text-btn" onClick={exitBatchMode}>取消</button>
          </div>
        </div>
      )}
      {showBizPanel && (
        <React.Fragment>
          <div className="biz-panel-mask" onClick={() => setShowBizPanel(false)} />
          <div className="biz-panel">
            {bizTypes.map(b => (
              <div
                key={b.key}
                className={"biz-panel-item" + (bizFilter === b.key ? " active" : "")}
                onClick={() => { setBizFilter(b.key); setShowBizPanel(false); }}
              >
                {b.label}
                {b.key !== "all" && <span className="biz-panel-count">({b.key === "finance" ? financeCount : 0})</span>}
              </div>
            ))}
          </div>
        </React.Fragment>
      )}
      {showAdvancedFilter && (
        <div className="advanced-filter-mask" onClick={() => setShowAdvancedFilter(false)}>
          <div className="advanced-filter-sheet" onClick={(e) => e.stopPropagation()}>
            <div className="advanced-filter-header">
              <div className="advanced-filter-title">筛选</div>
              <button type="button" className="advanced-filter-close" aria-label="关闭" onClick={() => setShowAdvancedFilter(false)}>×</button>
            </div>
            <div className="advanced-filter-body">
              <div className="advanced-filter-group">
                <label className="advanced-filter-label">流程类型</label>
                <select
                  className="advanced-filter-select"
                  value={draftAdvancedFilter.flowType}
                  onChange={(e) => setDraftAdvancedFilter({ ...draftAdvancedFilter, flowType: e.target.value })}
                >
                  <option value="all">全部流程</option>
                  <option value="incomeConfirm">收入确认申请流程</option>
                  <option value="incomeSplit">收入切分申请流程</option>
                </select>
              </div>
              <div className="advanced-filter-group">
                <label className="advanced-filter-label">发起人</label>
                <select
                  className="advanced-filter-select"
                  value={draftAdvancedFilter.submitter}
                  onChange={(e) => setDraftAdvancedFilter({ ...draftAdvancedFilter, submitter: e.target.value })}
                >
                  <option value="all">请选择</option>
                  {submitters.map(name => <option key={name} value={name}>{name}</option>)}
                </select>
              </div>
              <div className="advanced-filter-group">
                <div className="advanced-filter-label">时间范围</div>
                <div className="time-range-grid">
                  {timeRangeOptions.map(option => (
                    <button
                      type="button"
                      key={option.key}
                      className={"time-range-btn" + (draftAdvancedFilter.timeRange === option.key ? " active" : "")}
                      onClick={() => setDraftAdvancedFilter({ ...draftAdvancedFilter, timeRange: option.key })}
                    >
                      {option.label}
                    </button>
                  ))}
                </div>
                {draftAdvancedFilter.timeRange === "custom" && (
                  <div className="custom-date-range">
                    <input
                      type="date"
                      aria-label="开始日期"
                      value={draftAdvancedFilter.customStart}
                      onChange={(e) => setDraftAdvancedFilter({ ...draftAdvancedFilter, customStart: e.target.value })}
                    />
                    <span className="custom-date-separator">至</span>
                    <input
                      type="date"
                      aria-label="结束日期"
                      value={draftAdvancedFilter.customEnd}
                      onChange={(e) => setDraftAdvancedFilter({ ...draftAdvancedFilter, customEnd: e.target.value })}
                    />
                  </div>
                )}
              </div>
            </div>
            <div className="advanced-filter-actions">
              <button type="button" className="advanced-filter-action advanced-filter-reset" onClick={resetAdvancedFilter}>重置</button>
              <button type="button" className="advanced-filter-action advanced-filter-confirm" onClick={confirmAdvancedFilter}>确定</button>
            </div>
          </div>
        </div>
      )}
      <div className="content" style={batchMode ? { paddingBottom: 72 } : null}>
        <div className="list-container-v2">
          {tab === "todo" ? (
            todoList.length > 0 ? (
              todoList.map(item => {
                const isIncomeConfirm = item.flowType === "incomeConfirm";
                const handleClick = () => {
                  if (isIncomeConfirm) return onApproveIncomeConfirm(item);
                  return onApprove(item);
                };
                return (
                  <ListCard
                    key={item.id}
                    item={item}
                    onClick={handleClick}
                    onAction={handleClick}
                    batchMode={batchMode}
                    batchEligible={item.flowType === "incomeSplit" && item.node === "部组负责人"}
                    selected={selectedBatchIds.includes(item.id)}
                    onSelect={toggleBatchItem}
                    reviewScene={getReviewSceneForListItem(item)}
                  />
                );
              })
            ) : (
              <div className="empty-state">
                <div className="empty-icon">📋</div>
                <div className="empty-text">暂无待办事项</div>
              </div>
            )
          ) : tab === "done" ? (
            doneList.length > 0 ? (
              doneList.map(item => {
                const isIncomeConfirm = item.flowType === "incomeConfirm";
                const handleClick = () => isIncomeConfirm ? onViewIncomeConfirmDetail(item) : onViewDetail(item);
                return (
                  <ListCard
                    key={item.id}
                    item={item}
                    onClick={handleClick}
                    onAction={handleClick}
                    actionLabel="查看"
                    reviewScene={getReviewSceneForListItem(item)}
                  />
                );
              })
            ) : (
              <div className="empty-state">
                <div className="empty-icon">📋</div>
                <div className="empty-text">暂无已办事项</div>
              </div>
            )
          ) : tab === "doing" ? (
            doingList.length > 0 ? (
              doingList.map(item => {
                const isIncomeConfirm = item.flowType === "incomeConfirm";
                const handleClick = () => isIncomeConfirm ? onViewIncomeConfirmDetail(item) : onViewDetail(item);
                return (
                  <ListCard
                    key={item.id}
                    item={item}
                    onClick={handleClick}
                    onAction={handleClick}
                    actionLabel="查看"
                    reviewScene={getReviewSceneForListItem(item)}
                  />
                );
              })
            ) : (
              <div className="empty-state">
                <div className="empty-icon">📋</div>
                <div className="empty-text">暂无在办事项</div>
              </div>
            )
          ) : (
            <div className="empty-state">
              <div className="empty-icon">📋</div>
              <div className="empty-text">暂无数据</div>
            </div>
          )}
          <div className="list-end-tip">没有更多了</div>
        </div>
      </div>
      {batchMode && (
        <div className="bottom-bar" data-review-scene="list-batch">
          <button
            className="btn btn-danger btn-block"
            disabled={selectedBatchIds.length === 0}
            onClick={() => setBatchSheet("reject")}
          >
            退回
          </button>
          <button
            className="btn btn-primary btn-block"
            disabled={selectedBatchIds.length === 0}
            onClick={() => setBatchSheet("approve")}
          >
            同意
          </button>
        </div>
      )}
      {batchSheet && (
        <ApprovalSheet
          mode={batchSheet}
          title={batchSheet === "reject" ? "批量退回" : "批量审批"}
          description={`已选择 ${selectedBatchIds.length} 条收入切分任务`}
          reviewScene="list-batch"
          onCancel={() => setBatchSheet(null)}
          onConfirm={(opinion) => confirmBatchApproval(batchSheet, opinion)}
        />
      )}
      {batchToast && (
        <div className="toast-mask" onClick={() => setBatchToast(null)}>
          <div className="toast-box">
            <div className="toast-icon">{batchToast.type === "success" ? "✅" : "⚠️"}</div>
            <div className="toast-text">{batchToast.text}</div>
          </div>
        </div>
      )}
    </div>
  );
}

function CollapsibleSection({ title, children, defaultOpen, reviewScene }) {
  const [open, setOpen] = useState(defaultOpen !== false);
  return (
    <div className="detail-section" data-review-scene={reviewScene}>
      <div className="section-header" onClick={() => setOpen(!open)}>
        <span className="section-title">{title}</span>
        <span className={"section-arrow" + (open ? "" : " collapsed")}>▼</span>
      </div>
      {open && <div className="section-body">{children}</div>}
    </div>
  );
}

/* ===== 单列 label-value 行（与现有待办详情页统一） ===== */
function InfoRow({ label, value, isAmount, isLink }) {
  return (
    <div className="info-row">
      <span className="info-row-label">{label}</span>
      <span className={"info-row-value" + (isAmount ? " amount" : "") + (isLink ? " link" : "")}>{value}</span>
    </div>
  );
}

/* ===== 顶部卡片：项目名称为主，发起人降为副行 =====
   仅使用 PC 端确实存在的字段（项目名称、流程类型、状态、提交人姓名、提交时间），
   不展示头像、登录账号、岗位——PC 端原型均无，ESB 不一定能取到 */
function getStamp(status) {
  if (status === "审批完成") return { text: "已完成", cls: "done" };
  if (status === "退回") return { text: "已退回", cls: "reject" };
  if (status === "新建") return { text: "待提交", cls: "new" };
  return { text: "处理中", cls: "" };
}

function FlowHeaderCard({ submitter, status, projectName, flowType }) {
  const stamp = getStamp(status);
  const flowLabel = flowType === "incomeConfirm" ? "收入确认" : "收入切分";
  const flowTagClass = flowType === "incomeConfirm" ? "flow-tag-confirm" : "flow-tag-split";
  return (
    <div className="flow-header-card">
      <div className={"flow-stamp " + stamp.cls}>{stamp.text}</div>
      <div className="flow-header-main">
        <span className={"flow-title-tag " + flowTagClass}>{flowLabel}</span>
        {projectName}
      </div>
      <div className="flow-header-sub">
        <span>发起人 {submitter.name}</span>
        <span>{submitter.time}</span>
      </div>
    </div>
  );
}

/* ===== 明细 / 审批记录 页签 =====
   注：现有待办详情页还有「步骤明细」「流程图」两个页签，
   但 PC 端需求与原型均无节点流转数据，ESB 取不到，本期隐藏 */
const DETAIL_TABS = [
  { key: "detail", label: "明细" },
  { key: "opinion", label: "审批记录" }
];

function DetailTabs({ tab, onChange, detailReviewScene }) {
  return (
    <div className="detail-tabs">
      {DETAIL_TABS.map(t => (
        <div
          key={t.key}
          className={"detail-tab" + (tab === t.key ? " active" : "")}
          data-review-scene={t.key === "opinion" ? "split-5-records" : detailReviewScene}
          onClick={() => onChange(t.key)}
        >
          {t.label}
        </div>
      ))}
    </div>
  );
}

/* 审批记录页签：按审批时间倒序展示节点名称、处理人和时间；仅退回节点展示审批意见 */
function ApprovalRecordTab({ records }) {
  const sorted = records.slice().reverse();
  return (
    <CollapsibleSection title="审批记录" reviewScene="split-5-records">
      <div className="timeline">
        {sorted.map((r, i) => (
          <div className="timeline-item" key={i}>
            <div className={"timeline-dot " + (r.action === "approve" ? "approved" : r.action === "submit" ? "submitted" : r.action === "reject" ? "rejected" : "pending")}></div>
            <div className="timeline-content">
              <div className="timeline-header">
                <span className="timeline-time">{r.time}</span>
                <div className="timeline-node-row">
                  <span className="timeline-node-name">{r.nodeName}</span>
                  <span className="timeline-approver">- {r.name}</span>
                </div>
              </div>

/* 审批处理浮层：同意仅二次确认，退回时审批意见必填 */
function ApprovalSheet({ mode, onCancel, onConfirm, title, description, reviewScene }) {
  const [opinion, setOpinion] = useState("");
  const isReject = mode === "reject";
  return (
    <div className="modal-mask" data-review-scene={reviewScene} onClick={onCancel}>
      <div className="modal-sheet" onClick={(e) => e.stopPropagation()}>
        <div className="modal-title">{title || (isReject ? "退回" : "审批确认")}</div>
        {(description || !isReject) && (
          <div className="modal-content">{description || "确认同意该审批事项？"}</div>
        )}
        {isReject && (
          <React.Fragment>
            <div className="textarea-label">
              审批意见<span className="required-mark">*</span>
            </div>
            <textarea
              className="textarea"
              placeholder="请填写退回原因（必填）"
              value={opinion}
              onChange={(e) => setOpinion(e.target.value)}
              maxLength={200}
            />
          </React.Fragment>
        )}
        <div className="modal-actions" style={{ marginTop: 16 }}>
          <button className="btn btn-default" onClick={onCancel}>取消</button>
          <button
            className={"btn " + (isReject ? "btn-danger" : "btn-primary")}
            onClick={() => onConfirm(isReject ? opinion : "")}
          >
            {isReject ? "确认退回" : "同意"}
          </button>
        </div>
      </div>
    </div>
  );
}

function getReviewInitialScreen() {
  const review = new URLSearchParams(window.location.search).get("review");
  const splitTodo = id => mockTodoList.find(item => item.id === id);
  const splitDone = id => mockDoneList.find(item => item.id === id);
  const confirmTodo = id => mockIncomeConfirmTodoList.find(item => item.id === id);
  const confirmDone = id => mockIncomeConfirmDoneList.find(item => item.id === id);

  switch (review) {
    case "list-batch":
      return { name: "list", initialBatchMode: true, initialSelectedBatchIds: [2, 4] };
    case "confirm-101":
      return { name: "incomeConfirmApprove", item: confirmTodo(101) };
    case "confirm-101-approval":
      return { name: "incomeConfirmApprove", item: confirmTodo(101) };
    case "confirm-102":
      return { name: "incomeConfirmApprove", item: confirmTodo(102) };
    case "confirm-102-project":
      return { name: "incomeConfirmApprove", item: confirmTodo(102), initialScroll: 430 };
    case "confirm-103-detail":
      return { name: "incomeConfirmDetail", item: confirmDone(103) };
    case "confirm-103-project":
      return { name: "incomeConfirmDetail", item: confirmDone(103), initialScroll: 430 };
    case "confirm-101-records":
      return { name: "incomeConfirmApprove", item: confirmTodo(101), initialTab: "opinion" };
    case "confirm-101-reject":
      return { name: "incomeConfirmApprove", item: confirmTodo(101), initialSheet: "reject" };
    case "split-1":
      return { name: "approve", item: splitTodo(1) };
    case "split-2":
      return { name: "approve", item: splitTodo(2) };
    case "split-3":
      return { name: "approve", item: splitTodo(3) };
    case "split-5-detail":
      return { name: "detail", item: splitDone(5) };
    case "split-5-history":
      return { name: "detail", item: splitDone(5), initialScroll: 690 };
    case "split-5-records":
      return { name: "detail", item: splitDone(5), initialTab: "opinion" };
    default:
      return { name: "list" };
  }
}

const REVIEW_SCENE_EVENT = "review-scene-change";

function setReviewSceneContext(key) {
  const params = new URLSearchParams(window.location.search);
  if (params.get("annotate") !== "1") return;
  if (!reviewScenarioGuides.some(item => item.key === key)) return;
  const nextUrl = new URL(window.location.href);
  nextUrl.searchParams.set("review", key);
  window.history.replaceState(null, "", nextUrl.toString());
  window.dispatchEvent(new CustomEvent(REVIEW_SCENE_EVENT, { detail: key }));
}

function ReviewGuide() {
  const [open, setOpen] = useState(true);
  const params = new URLSearchParams(window.location.search);
  const annotated = params.get("annotate") === "1";
  const [currentKey, setCurrentKey] = useState(params.get("review") || "list");

  useEffect(() => {
    document.body.classList.toggle("review-mode-body", annotated && open);
    return () => document.body.classList.remove("review-mode-body");
  }, [annotated, open]);

  useEffect(() => {
    if (!annotated) return undefined;
    const handleSceneChange = event => setCurrentKey(event.detail || "list");
    const handlePrototypeClick = event => {
      if (!(event.target instanceof Element)) return;
      const contextElement = event.target.closest("[data-review-scene]");
      if (contextElement && contextElement.dataset.reviewScene) {
        setReviewSceneContext(contextElement.dataset.reviewScene);
      }
    };
    window.addEventListener(REVIEW_SCENE_EVENT, handleSceneChange);
    document.addEventListener("click", handlePrototypeClick, true);
    return () => {
      window.removeEventListener(REVIEW_SCENE_EVENT, handleSceneChange);
      document.removeEventListener("click", handlePrototypeClick, true);
    };
  }, [annotated]);

  if (!annotated) return null;

  const current = reviewScenarioGuides.find(item => item.key === currentKey) || reviewScenarioGuides[0];

  return ReactDOM.createPortal(
    <React.Fragment>
      <button className="review-guide-toggle" onClick={() => setOpen(value => !value)}>
        {open ? "收起说明" : "场景说明"}
      </button>
      {open && (
        <aside className="review-guide-panel">
          <div className="review-guide-head">
            <h2>场景需求说明</h2>
            <button className="review-guide-close" onClick={() => setOpen(false)}>×</button>
          </div>
          <div className="review-current-scene" aria-live="polite">
            <span>当前场景</span>
            <strong>{current.number} {current.title}</strong>
          </div>
          <div className="review-guide-section logic">
            <strong>场景逻辑</strong>
            {current.logic}
          </div>
          <div className="review-guide-section">
            <strong>页面功能重点</strong>
            <ol className="review-guide-points">{current.points.map((point, index) => <li key={index}>{point}</li>)}</ol>
          </div>
          <div className="review-guide-section boundary">
            <strong>端侧与系统边界</strong>
            {current.boundary}
          </div>
          <div className="review-guide-section note">
            <strong>补充说明</strong>
            {current.note}
          </div>
          <p className="review-guide-tip">点击左侧原型中的卡片、页签、详情入口或审批按钮，右侧说明将自动切换到对应场景。</p>
        </aside>
      )}
    </React.Fragment>,
    document.body
  );
}

/* ========== App ========== */
function getReviewSceneForScreen(targetScreen) {
  if (!targetScreen || targetScreen.name === "list") return "list";
  if (targetScreen.name === "historyDetail" || targetScreen.name === "detail") return "split-5-history";
  if (targetScreen.name === "transfer") return "split-1";
  if (targetScreen.item) return getReviewSceneForListItem(targetScreen.item);
  return "list";
}

function App() {
  const [screen, setScreen] = useState(getReviewInitialScreen);

  useEffect(() => {
    if (!screen.initialScroll) return undefined;
    const timer = setTimeout(() => {
      const content = document.querySelector(".content");
      if (content) content.scrollTop = screen.initialScroll;
    }, 120);
    return () => clearTimeout(timer);
  }, [screen.name, screen.initialScroll]);

  const openScreen = (nextScreen, reviewScene) => {
    setReviewSceneContext(reviewScene);
    setScreen(previousScreen => ({ ...nextScreen, returnScreen: previousScreen }));
  };
  const goList = () => { setReviewSceneContext("list"); setScreen({ name: "list", initialTab: "todo" }); };
  const goBack = () => {
    const previousScreen = screen.returnScreen || { name: "list", initialTab: "todo" };
    setReviewSceneContext(getReviewSceneForScreen(previousScreen));
    setScreen(previousScreen);
  };
  const goApprove = (item) => openScreen({ name: "approve", item }, getReviewSceneForListItem(item));
  const goTransfer = (item) => openScreen({ name: "transfer", item }, "split-1");
  const goDetail = (item) => openScreen({ name: "detail", item }, "split-5-history");
  const goHistoryDetail = (data) => openScreen({ name: "historyDetail", data }, "split-5-history");
  const goApproveIncomeConfirm = (item) => openScreen({ name: "incomeConfirmApprove", item }, getReviewSceneForListItem(item));
  const goIncomeConfirmDetail = (item) => openScreen({ name: "incomeConfirmDetail", item }, getReviewSceneForListItem(item));
  const rememberListTab = (initialTab) => setScreen(currentScreen => currentScreen.name === "list" ? { ...currentScreen, initialTab } : currentScreen);

  return (
    <React.Fragment>
      <ReviewGuide />
      {screen.name === "list" && (
        <ListPage
          onApprove={goApprove}
          onViewDetail={goDetail}
          onTransfer={goTransfer}
          onApproveIncomeConfirm={goApproveIncomeConfirm}
          onViewIncomeConfirmDetail={goIncomeConfirmDetail}
          initialTab={screen.initialTab || "todo"}
          onTabChange={rememberListTab}
          initialBatchMode={screen.initialBatchMode}
          initialSelectedBatchIds={screen.initialSelectedBatchIds}
        />
      )}
      {screen.name === "approve" && (
        <ApprovalPage
          item={screen.item}
          onBack={goBack}
          onSubmit={goList}
          onViewHistory={goHistoryDetail}
          initialTab={screen.initialTab}
          initialSheet={screen.initialSheet}
        />
      )}
      {screen.name === "transfer" && (
        <TransferPage
          onBack={goBack}
          onConfirm={goList}
        />
      )}
      {screen.name === "detail" && (
        <DetailPage
          item={screen.item}
          onBack={goBack}
          onViewHistory={goHistoryDetail}
          initialTab={screen.initialTab}
        />
      )}
      {screen.name === "historyDetail" && (
        <HistorySplitDetailPage
          data={screen.data}
          onBack={goBack}
        />
      )}
      {screen.name === "incomeConfirmApprove" && (
        <IncomeConfirmApprovalPage
          item={screen.item}
          onBack={goBack}
          onSubmit={goList}
          initialTab={screen.initialTab}
          initialSheet={screen.initialSheet}
        />
      )}
      {screen.name === "incomeConfirmDetail" && (
        <IncomeConfirmDetailPage
          item={screen.item}
          onBack={goBack}
          initialTab={screen.initialTab}
        />
      )}
    </React.Fragment>
  );
}

ReactDOM.render(<App />, document.getElementById("app"));
</script>
